<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Self-hosted Poppins. All three weights appear above the fold (600 in the
         header/nav, 800 in the hero heading, 500 in the hero subheads), so all three
         are preloaded. ~23 KB total. crossorigin is required on font preloads even
         for same-origin requests, or the browser fetches them twice. -->
    <link rel="preload" href="/fonts/poppins-v24-latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-v24-latin-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-v24-latin-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/linkedin-image.webp" />

    <title>Levan Mosiashvili</title>
    <meta name="description" content="Frontend Developer Portfolio of Levan Mosiashvili" />
    <link rel="canonical" href="https://portfolio-ruby-pi-33.vercel.app/" />

    <!-- Open Graph (for LinkedIn, Discord, Facebook, etc.) -->
    <meta property="og:title" content="Levan Mosiashvili | Portfolio" />
    <meta property="og:description" content="Check out my projects, skills, and portfolio." />
    <meta property="og:image" content="https://portfolio-ruby-pi-33.vercel.app/thumbnail.jpg" />
    <meta property="og:url" content="https://portfolio-ruby-pi-33.vercel.app/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Levan Mosiashvili | Portfolio" />
    <meta name="twitter:description" content="Check out my projects, skills, and portfolio." />
    <meta name="twitter:image" content="https://portfolio-ruby-pi-33.vercel.app/thumbnail.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Levan Mosiashvili",
      "jobTitle": "Frontend Developer",
      "url": "https://portfolio-ruby-pi-33.vercel.app/",
      "sameAs": [
        "https://www.linkedin.com/in/levan-mosiashvili-39165b301/",
        "https://github.com/Mosa-5"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
